/* ============ REGLAS DE ORO ============ */
const RULES = [
 {es:'<b>Nunca empieces</b> un medicamento, vitamina o remedio nuevo sin preguntar antes a tu equipo de diálisis.',
  en:'<b>Never start</b> a new medicine, vitamin or remedy without asking your dialysis team first.'},
 {es:'Los <b>aglutinantes de fósforo</b> van <b>con la comida</b>: sin comida, no funcionan.',
  en:'<b>Phosphate binders</b> go <b>with food</b>: without food, they do not work.'},
 {es:'<b>Lee las etiquetas:</b> vigila el potasio, los aditivos con «fos/phos» y el sodio.',
  en:'<b>Read labels:</b> watch for potassium, “phos” additives and sodium.'},
 {es:'<b>Ante la duda, pregunta.</b> Para eso está tu equipo: más vale preguntar que lamentar.',
  en:'<b>When in doubt, ask.</b> That is what your team is for: better to ask than to regret.'}
];

/* ============ LÓGICA ============ */
let lang = localStorage.getItem('pt-lang') || 'es';
let tab = 'all';

const norm = s => (s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');

function cardHTML(it){
  const u = UI[lang];
  return `<div class="card ${it.l}">
    <div class="top"><span class="light ${it.l}">${u[it.l]}</span></div>
    <div class="nm">${lang==='es'?it.es:it.en}</div>
    <div class="ex">${lang==='es'?it.des:it.den}</div>
    <div class="ft">⚠️ ${u.cardFoot}</div>
  </div>`;
}
function groupHTML(g, title){
  const items = ITEMS.filter(i=>i.g===g);
  if(!items.length) return '';
  return (title?`<h3 class="sub">${title}</h3>`:'') + items.map(cardHTML).join('');
}
function renderBrowse(){
  const u = UI[lang]; let h = '';
  if(tab==='all' || tab==='med'){
    h += `<h2 class="sec">${u.secMed}</h2>` + groupHTML('med','');
  }
  if(tab==='all' || tab==='food'){
    h += `<h2 class="sec">${u.secFood}</h2>`
       + groupHTML('k', u.subK) + groupHTML('p', u.subP) + groupHTML('na', u.subNa)
       + groupHTML('safe', u.subSafe) + groupHTML('prot', u.subProt);
  }
  if(tab==='all' || tab==='rules'){
    h += `<h2 class="sec">${u.secRules}</h2>` + RULES.map((r,i)=>
      `<div class="rule"><div class="num">${i+1}</div><div class="tx">${lang==='es'?r.es:r.en}</div></div>`).join('');
  }
  document.getElementById('browseBody').innerHTML = h;
}
function onSearch(fromBtn){
  const raw = document.getElementById('q').value.trim();
  const res = document.getElementById('results');
  const q = norm(raw);
  if(q.length < 2){ res.innerHTML=''; document.getElementById('browse').style.display=''; return; }
  const hits = ITEMS.filter(it => norm(it.es+' '+it.en+' '+it.a).includes(q)
    || q.split(/\s+/).every(w => w.length<3 || norm(it.es+' '+it.en+' '+it.a).includes(w)));
  document.getElementById('browse').style.display='none';
  if(!hits.length){
    res.innerHTML = `<div class="reshead">${UI[lang].resFor} “${raw}”:</div>
      <div class="empty">🔍 ${UI[lang].noRes} “<b>${raw}</b>” ${UI[lang].noRes2}<br><br>⚠️ ${UI[lang].cardFoot}</div>`;
    return;
  }
  res.innerHTML = `<div class="reshead">${UI[lang].resFor} “${raw}”:</div>` + hits.map(cardHTML).join('');
}
function setTab(t){
  tab = t;
  document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('on', b.dataset.tab===t));
  renderBrowse();
}
function quickSearch(txt){
  document.getElementById('q').value = txt; onSearch(true);
  window.scrollTo({top:0, behavior:'smooth'});
}
function applyLang(){
  const u = UI[lang];
  document.documentElement.lang = lang;
  document.getElementById('hTitle').innerHTML = u.title;
  document.getElementById('hTag').textContent = u.tag;
  document.getElementById('hBy').textContent = u.by;
  document.getElementById('q').placeholder = u.ph;
  document.getElementById('btnGo').textContent = u.go;
  document.getElementById('discMain').innerHTML = u.disc;
  document.getElementById('lgOk').textContent = u.lgOk;
  document.getElementById('lgWarn').textContent = u.lgWarn;
  document.getElementById('lgNo').textContent = u.lgNo;
  document.getElementById('tabAll').textContent = u.tabAll;
  document.getElementById('tabMed').textContent = u.tabMed;
  document.getElementById('tabFood').textContent = u.tabFood;
  document.getElementById('tabRules').textContent = u.tabRules;
  document.getElementById('footNote').textContent = u.foot;
  document.getElementById('btnES').classList.toggle('on', lang==='es');
  document.getElementById('btnEN').classList.toggle('on', lang==='en');
  const pops = lang==='es' ? ['Tylenol','Banana','Ibuprofeno','Queso','Pollo','Sal light']
                           : ['Tylenol','Banana','Ibuprofen','Cheese','Chicken','Light salt'];
  document.getElementById('popular').innerHTML = `<span>${u.popular}</span>` +
    pops.map(p=>`<button class="pchip" onclick="quickSearch('${p}')">${p}</button>`).join('');
  renderBrowse();
  if(document.getElementById('q').value.trim().length >= 2) onSearch();
}
function setLang(l){ lang = l; localStorage.setItem('pt-lang', l); applyLang(); }
applyLang();
</script>
