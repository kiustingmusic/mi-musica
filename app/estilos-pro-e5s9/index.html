<title>Estilos PRO · Kiustin G</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
  :root{
    --bg:#0c0c0f; --card:#16161c; --card2:#1d1d24; --line:#2a2a33;
    --ink:#f3efe4; --soft:#b7b1a1; --gold:#c9a24b; --gold2:#e8cb7d; --red:#e4574f;
    --shadow:0 14px 34px rgba(0,0,0,.5);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    font-family:"Inter",system-ui,sans-serif;color:var(--ink);min-height:100dvh;
    background:
      radial-gradient(700px 340px at 85% -60px, rgba(201,162,75,.16), transparent 70%),
      radial-gradient(600px 300px at 8% 0, rgba(201,162,75,.08), transparent 70%),
      var(--bg);
  }
  h1,h2,h3,.serif{font-family:"Playfair Display",Georgia,serif}
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
  .wrap{max-width:880px;margin:0 auto;padding:16px 14px 46px}
  .hidden{display:none !important}

  .lang-bar{display:flex;justify-content:flex-end;padding:2px 0 0}
  .lang-switch{display:inline-flex;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:4px;gap:4px}
  .lang-switch button{border-radius:999px;padding:8px 18px;font-weight:800;font-size:14px;min-height:40px;color:var(--soft)}
  .lang-switch button.active{background:var(--gold);color:#171205}

  .hero{text-align:center;padding:10px 4px 4px}
  .brand{letter-spacing:.42em;font-weight:800;font-size:13px;color:var(--gold);text-transform:uppercase}
  .hero h1{font-size:clamp(44px,11vw,68px);margin:6px 0 2px;line-height:1;font-weight:800}
  .hero .sub{color:var(--soft);font-size:16px;line-height:1.5;max-width:560px;margin:8px auto 0}
  .pill{display:inline-block;margin-top:12px;border:1px solid var(--gold);color:var(--gold2);
    font-weight:800;font-size:13px;letter-spacing:.14em;border-radius:999px;padding:6px 16px;text-transform:uppercase}
  .pill.pro{background:var(--gold);color:#171205}

  .tabs{position:sticky;top:0;z-index:30;display:flex;gap:8px;overflow-x:auto;padding:12px 2px 10px;
    background:linear-gradient(var(--bg) 78%, transparent);scrollbar-width:none}
  .tabs::-webkit-scrollbar{display:none}
  .tab{flex:0 0 auto;border:1px solid var(--line);background:var(--card);color:var(--soft);
    border-radius:999px;padding:10px 16px;font-weight:700;font-size:14.5px;min-height:44px;white-space:nowrap}
  .tab.active{background:var(--gold);border-color:var(--gold);color:#171205}
  .tab .cnt{opacity:.75;font-weight:600;font-size:12.5px}

  .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:6px}
  @media (min-width:640px){.grid{grid-template-columns:1fr 1fr 1fr}}
  .card{position:relative;background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden;text-align:left;padding:0;width:100%}
  .card:active{transform:scale(.985)}
  .card .ph{position:relative;aspect-ratio:1/1;overflow:hidden;background:#22222a}
  .card.wide .ph{aspect-ratio:3/2}
  .card img{width:100%;height:100%;object-fit:cover;display:block}
  .card.locked img{filter:blur(8px) brightness(.68);transform:scale(1.08)}
  .lockbadge{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:34px;
    text-shadow:0 2px 12px rgba(0,0,0,.8)}
  .probadge{position:absolute;left:10px;top:10px;background:var(--gold);color:#171205;font-weight:800;font-size:11px;
    letter-spacing:.1em;border-radius:999px;padding:4px 10px}
  .heart{position:absolute;right:8px;top:8px;width:42px;height:42px;border-radius:50%;background:rgba(10,10,14,.55);
    color:#fff;font-size:21px;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(3px)}
  .heart.on{color:var(--red)}
  .card .nm{padding:11px 12px 13px;font-weight:700;font-size:15.5px;line-height:1.3}
  .card .nm small{display:block;color:var(--soft);font-weight:600;font-size:12px;margin-top:2px}
  .empty{grid-column:1/-1;text-align:center;color:var(--soft);padding:34px 18px;line-height:1.6}

  .procard{margin-top:30px;background:linear-gradient(160deg,#1c1a13,#121216 55%);border:1px solid var(--gold);
    border-radius:22px;padding:22px 20px;box-shadow:var(--shadow)}
  .procard.pulse{animation:pulse 1s ease}
  @keyframes pulse{0%,100%{box-shadow:var(--shadow)}30%{box-shadow:0 0 0 5px rgba(201,162,75,.45)}}
  .procard h2{margin:0 0 4px;font-size:27px}
  .procard .price{color:var(--gold2);font-weight:800;font-size:19px}
  .procard ul{margin:14px 0 4px;padding:0;list-style:none}
  .procard li{padding:7px 0 7px 28px;position:relative;color:var(--ink);line-height:1.45;font-size:15.5px;border-bottom:1px dashed rgba(201,162,75,.22)}
  .procard li:last-child{border-bottom:none}
  .procard li::before{content:"✦";position:absolute;left:4px;color:var(--gold)}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--gold);color:#171205;
    font-weight:800;font-size:16.5px;border-radius:14px;padding:15px 22px;min-height:54px;width:100%;margin-top:14px;text-decoration:none}
  .btn.ghost{background:transparent;border:1px solid var(--gold);color:var(--gold2)}

  .section{margin-top:34px}
  .section h2{font-size:26px;margin:0 0 6px}
  .section .intro{color:var(--soft);line-height:1.55;margin:0 0 12px;font-size:15.5px}
  .chips{display:flex;gap:8px;flex-wrap:wrap}
  .chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:10px 16px;font-weight:700;font-size:14.5px;min-height:44px;color:var(--soft)}
  .chip.active{background:var(--gold);color:#171205;border-color:var(--gold)}
  .facebox{margin-top:14px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px}
  .facebox .row{margin:0 0 10px;line-height:1.55;font-size:15.5px}
  .facebox .lab{color:var(--gold);font-weight:800;font-size:12.5px;letter-spacing:.12em;text-transform:uppercase;display:block;margin-bottom:2px}
  .recs{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px}
  .rec{display:flex;align-items:center;gap:10px;background:var(--card2);border:1px solid var(--line);border-radius:14px;padding:6px 12px 6px 6px;font-weight:700;font-size:14px}
  .rec img{width:44px;height:44px;border-radius:10px;object-fit:cover}

  .trow{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:8px}
  .trow .t1{color:var(--gold2);font-weight:800;font-size:15px;margin-bottom:3px}
  .trow .t2,.trow .t3{color:var(--ink);line-height:1.5;font-size:15px}
  .trow .t3{color:var(--soft)}
  .phrase{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px 15px;margin-bottom:8px;line-height:1.55}
  .phrase .es{font-weight:700;font-size:15.5px}
  .phrase .en{color:var(--soft);font-size:15px;margin-top:3px}
  .phrase .tag{color:var(--gold);font-size:11px;font-weight:800;letter-spacing:.1em}

  footer{margin-top:40px;text-align:center;color:var(--soft);font-size:13.5px;line-height:1.7}
  footer .sign{color:var(--gold2);font-weight:700}
  footer a{color:var(--gold2)}

  .backdrop{position:fixed;inset:0;background:rgba(4,4,6,.72);z-index:60;display:flex;align-items:flex-end;justify-content:center}
  @media (min-width:640px){.backdrop{align-items:center;padding:18px}}
  .sheet{background:#141419;border:1px solid var(--line);width:100%;max-width:620px;max-height:92dvh;overflow-y:auto;
    border-radius:22px 22px 0 0;box-shadow:var(--shadow)}
  @media (min-width:640px){.sheet{border-radius:22px}}
  .sheet .ph{position:relative;aspect-ratio:16/10;overflow:hidden;background:#22222a}
  .sheet .ph img{width:100%;height:100%;object-fit:cover}
  .sheet .body{padding:18px 20px 24px}
  .sheet h3{font-family:"Playfair Display",serif;font-size:29px;margin:0 0 4px;line-height:1.15}
  .field{margin-top:13px;line-height:1.55;font-size:15.5px}
  .field .lab{color:var(--gold);font-weight:800;font-size:12px;letter-spacing:.12em;text-transform:uppercase;display:block;margin-bottom:2px}
  .phrasebox{margin-top:16px;border:1px solid var(--gold);border-radius:16px;padding:14px 16px;background:rgba(201,162,75,.07)}
  .phrasebox .lab{color:var(--gold2);font-weight:800;font-size:12px;letter-spacing:.12em;text-transform:uppercase}
  .phrasebox .pes{font-weight:700;font-size:16.5px;line-height:1.5;margin-top:6px}
  .phrasebox .pen{color:var(--soft);font-size:15.5px;line-height:1.5;margin-top:5px}
  .sheet .x{position:absolute;right:10px;top:10px;width:44px;height:44px;border-radius:50%;background:rgba(10,10,14,.6);color:#fff;font-size:20px;z-index:2}
  .sheet .heart{top:10px;right:64px}

  .barber{position:fixed;inset:0;background:#000;z-index:80;display:flex;flex-direction:column}
  .barber .bimg{flex:1;min-height:0}
  .barber .bimg img{width:100%;height:100%;object-fit:cover;display:block}
  .barber .binfo{padding:18px 20px calc(20px + env(safe-area-inset-bottom));background:linear-gradient(transparent,#000 30%)}
  .barber h3{font-family:"Playfair Display",serif;font-size:clamp(38px,10vw,58px);margin:0;line-height:1.05}
  .barber .bp{font-size:18px;line-height:1.5;margin-top:10px;font-weight:600}
  .barber .bp.en{color:var(--soft);font-weight:500}
  .barber .hint{margin-top:12px;color:var(--gold2);font-size:13.5px;letter-spacing:.04em}
  .barber .x{position:absolute;right:12px;top:calc(12px + env(safe-area-inset-top));width:48px;height:48px;border-radius:50%;
    background:rgba(10,10,14,.65);color:#fff;font-size:22px;z-index:2}
</style>
</head>

    ],

    guideIntro: "Tap your face shape and see what suits you, what to watch out for, and the recommended styles.",

let lang = localStorage.getItem("estilos_lang") || "es";
if (!STR[lang]) lang = "es";
let curCat = "hombres";
let favs = new Set(JSON.parse(localStorage.getItem("estilos_favs_v1") || "[]"));
let curFace = null;

const $ = s => document.querySelector(s);
const S = () => STR[lang];
const byId = id => DATA.styles.find(x => x.id === id);
const isOpen = st => MODE === "pro" || st.free;
const catName = c => { const k = DATA.cats.find(x => x.id === c); return k ? k[lang] : c; };

function saveFavs(){ localStorage.setItem("estilos_favs_v1", JSON.stringify([...favs])); }
function toggleFav(id, ev){
  if (ev) ev.stopPropagation();
  favs.has(id) ? favs.delete(id) : favs.add(id);
  saveFavs(); renderGrid();
  const sh = $("#sheet"); if (!sh.classList.contains("hidden")) fillSheet(currentSheetId);
}

function fieldLabels(cat){
  if (cat === "barba") return { a: S().labSuits, b: S().labKey, c: null };
  if (cat === "color") return { a: S().labEffect, b: null, c: S().labUpkeep };
  return { a: S().labSuits, b: S().labAsk, c: S().labUpkeep };
}
function barberLines(st){
  return {
    es: st.es.b ? st.es.b : (st.es.n + " — " + st.es.a),
    en: st.en.b ? st.en.b : (st.en.n + " — " + st.en.a)
  };
}

function renderTabs(){
  const t = $("#tabs"); t.innerHTML = "";
  DATA.cats.forEach(c => {
    const n = DATA.styles.filter(x => x.cat === c.id).length;
    const b = document.createElement("button");
    b.className = "tab" + (curCat === c.id ? " active" : "");
    b.innerHTML = c[lang] + ' <span class="cnt">' + n + "</span>";
    b.onclick = () => { curCat = c.id; renderTabs(); renderGrid(); };
    t.appendChild(b);
  });
  const f = document.createElement("button");
  f.className = "tab" + (curCat === "favs" ? " active" : "");
  f.innerHTML = "♥ " + S().favs + ' <span class="cnt">' + favs.size + "</span>";
  f.onclick = () => { curCat = "favs"; renderTabs(); renderGrid(); };
  t.appendChild(f);
}

function cardEl(st){
  const open = isOpen(st);
  const d = st[lang];
  const card = document.createElement("button");
  card.className = "card" + (open ? "" : " locked") + (st.plate ? " wide" : "");
  card.setAttribute("aria-label", d.n);
  const heart = '<span class="heart' + (favs.has(st.id) ? " on" : "") + '" data-fav="' + st.id + '">♥</span>';
  const badge = open ? "" : '<span class="probadge">' + S().proTag + '</span><span class="lockbadge">🔒</span>';
  card.innerHTML = '<span class="ph"><img loading="lazy" src="' + IMG_BASE + st.img + '" alt="' + d.n + '">' + badge + heart + "</span>" +
    '<span class="nm">' + d.n + "<small>" + (open ? S().open : S().proLocked) + "</small></span>";
  card.querySelector("[data-fav]").addEventListener("click", ev => toggleFav(st.id, ev));
  card.addEventListener("click", () => {
    if (open) openSheet(st.id);
    else { const p = $("#procard"); if (p) { p.scrollIntoView({ behavior: "smooth", block: "center" }); p.classList.remove("pulse"); void p.offsetWidth; p.classList.add("pulse"); } }
  });
  return card;
}

function renderGrid(){
  const g = $("#grid"); g.innerHTML = "";
  let list = curCat === "favs" ? DATA.styles.filter(x => favs.has(x.id)) : DATA.styles.filter(x => x.cat === curCat);
  if (!list.length) { g.innerHTML = '<div class="empty">' + S().noFavs + "</div>"; return; }
  list.forEach(st => g.appendChild(cardEl(st)));
}

let currentSheetId = null;
function openSheet(id){
  currentSheetId = id;
  fillSheet(id);
  $("#backdrop").classList.remove("hidden");
  document.body.style.overflow = "hidden";
}
function closeSheet(){
  $("#backdrop").classList.add("hidden");
  document.body.style.overflow = "";
  currentSheetId = null;
}
function fillSheet(id){
  const st = byId(id); if (!st) return;
  const d = st[lang], L = fieldLabels(st.cat), bl = barberLines(st);
  let fields = "";
  if (st.plate) {
    fields = '<div class="field">' + d.a + "</div>";
  } else {
    fields += '<div class="field"><span class="lab">' + L.a + "</span>" + d.a + "</div>";
    if (L.b && d.b) fields += '<div class="field"><span class="lab">' + L.b + "</span>" + d.b + "</div>";
    if (L.c && d.c) fields += '<div class="field"><span class="lab">' + L.c + "</span>" + d.c + "</div>";
  }
  $("#sheet").innerHTML =
    '<div class="ph"><img src="' + IMG_BASE + st.img + '" alt="' + d.n + '">' +
    '<button class="x" id="sheet-x" aria-label="' + S().close + '">✕</button>' +
    '<span class="heart' + (favs.has(st.id) ? " on" : "") + '" id="sheet-heart">♥</span></div>' +
    '<div class="body"><h3>' + d.n + "</h3>" +
    '<div style="color:var(--soft);font-size:13.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase">' + catName(st.cat) + "</div>" +
    fields +
    '<div class="phrasebox"><span class="lab">' + S().forBarber + '</span>' +
    '<div class="pes">“' + bl.es + '”</div><div class="pen">“' + bl.en + '”</div></div>' +
    '<button class="btn" id="sheet-barber">' + S().showBarber + "</button>" +
    "</div>";
  $("#sheet-x").onclick = closeSheet;
  $("#sheet-heart").addEventListener("click", ev => toggleFav(st.id, ev));
  $("#sheet-barber").onclick = () => openBarber(st.id);
}
$("#backdrop").addEventListener("click", e => { if (e.target.id === "backdrop") closeSheet(); });

function openBarber(id){
  const st = byId(id); if (!st) return;
  const d = st[lang], bl = barberLines(st);
  const first = lang === "es" ? bl.es : bl.en, second = lang === "es" ? bl.en : bl.es;
  $("#barber").innerHTML =
    '<button class="x" id="barber-x" aria-label="' + S().close + '">✕</button>' +
    '<div class="bimg"><img src="' + IMG_BASE + st.img + '" alt="' + d.n + '"></div>' +
    '<div class="binfo"><h3>' + d.n + '</h3>' +
    '<div class="bp">“' + first + '”</div><div class="bp en">“' + second + '”</div>' +
    '<div class="hint">' + S().barberHint + "</div></div>";
  $("#barber").classList.remove("hidden");
  $("#barber-x").onclick = () => { $("#barber").classList.add("hidden"); };
}

function renderProCard(){
  const p = $("#procard");
  if (MODE !== "free") { p.classList.add("hidden"); return; }
  p.classList.remove("hidden");
  p.innerHTML = "<h2>" + S().proTitle + '</h2><div class="price">' + S().proPrice + "</div>" +
    "<ul>" + S().proList.map(x => "<li>" + x + "</li>").join("") + "</ul>" +
    (PAYHIP_PRO_URL ? '<a class="btn" href="' + PAYHIP_PRO_URL + '" target="_blank" rel="noopener">' + S().proBtn + "</a>" : "");
}

function tableHTML(rows, cols){
  return rows.map(r => '<div class="trow"><div class="t1">' + r[0][lang] + '</div><div class="t2">' + r[1][lang] + '</div><div class="t3">' + r[2][lang] + "</div></div>").join("");
}
function renderExtras(){
  const ex = $("#extras");
  if (MODE !== "pro") { ex.innerHTML = ""; return; }
  let h = "";
  h += '<section class="section"><h2>' + S().guideT + '</h2><p class="intro">' + S().guideIntro + '</p><div class="chips" id="face-chips">' +
    DATA.faces.map(f => '<button class="chip' + (curFace === f.id ? " active" : "") + '" data-face="' + f.id + '">' + f[lang].face + "</button>").join("") + '</div><div id="face-box"></div></section>';
  h += '<section class="section"><h2>' + S().phrasesT + '</h2><p class="intro">' + S().phrasesIntro + "</p>" +
    DATA.phrases.map(p => '<div class="phrase"><div class="es">' + (lang === "es" ? p[0] : p[1]) + '</div><div class="en">' + (lang === "es" ? p[1] : p[0]) + "</div></div>").join("") + "</section>";
  h += '<section class="section"><h2>' + S().kitT + '</h2><p class="intro">' + S().kitIntro + "</p>" + tableHTML(DATA.kit, S().kitCols) + "</section>";
  h += '<section class="section"><h2>' + S().looksT + '</h2><p class="intro">' + S().looksIntro + "</p>" + tableHTML(DATA.looks, S().looksCols) + "</section>";
  h += '<section class="section"><h2>' + S().modaT + "</h2>" + tableHTML(DATA.moda, S().modaCols) + "</section>";
  h += '<section class="section"><h2>' + S().ageT + "</h2>" + tableHTML(DATA.age, S().ageCols) + "</section>";
  ex.innerHTML = h;
  ex.querySelectorAll("[data-face]").forEach(b => b.addEventListener("click", () => { curFace = b.dataset.face; renderExtras(); fillFace(); }));
  fillFace();
}
function fillFace(){
  const box = $("#face-box"); if (!box) return;
  if (!curFace) { box.innerHTML = ""; return; }
  const f = DATA.faces.find(x => x.id === curFace); if (!f) { box.innerHTML = ""; return; }
  const d = f[lang];
  box.innerHTML = '<div class="facebox">' +
    '<p class="row"><span class="lab">' + S().gSuits + "</span>" + d.suits + "</p>" +
    '<p class="row"><span class="lab">' + S().gAvoid + "</span>" + d.avoid + "</p>" +
    '<div class="recs">' + f.rec.map(id => { const st = byId(id); return '<button class="rec" data-rec="' + id + '"><img src="' + IMG_BASE + st.img + '" alt="">' + st[lang].n + "</button>"; }).join("") + "</div></div>";
  box.querySelectorAll("[data-rec]").forEach(b => b.addEventListener("click", () => openSheet(b.dataset.rec)));
}

function renderAll(){
  document.documentElement.lang = lang;
  $("#lang-es").classList.toggle("active", lang === "es");
  $("#lang-en").classList.toggle("active", lang === "en");
  $("#hero-title").textContent = MODE === "pro" ? (lang === "es" ? "Estilos PRO" : "Styles PRO") : (lang === "es" ? "Estilos" : "Styles");
  $("#hero-sub").textContent = S().heroSub;
  const pill = $("#hero-pill");
  pill.textContent = MODE === "pro" ? S().pillPro : S().pillFree;
  pill.classList.toggle("pro", MODE === "pro");
  $("#foot-note").textContent = S().footNote;
  renderTabs(); renderGrid(); renderProCard(); renderExtras();
  if (currentSheetId) fillSheet(currentSheetId);
}
$("#lang-es").addEventListener("click", () => { lang = "es"; localStorage.setItem("estilos_lang", "es"); renderAll(); });
$("#lang-en").addEventListener("click", () => { lang = "en"; localStorage.setItem("estilos_lang", "en"); renderAll(); });
renderAll();
</script>
</body>
</html>
